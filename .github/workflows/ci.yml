name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:api
      - run: npm run test:online-api
      - run: npm run build:edge && git diff --exit-code -- supabase/functions/rooms/index.ts
      - run: npm run test:edge
